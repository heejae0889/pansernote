services:
  pansernote:
    # PaddlePaddle은 ARM용 Linux 패키지가 없어서 Mac(Apple Silicon)에서도 amd64로 빌드
    platform: linux/amd64
    build:
      context: .
    environment:
      FLASK_HOST: "0.0.0.0"
      FLASK_DEBUG: "0"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-}"
    ports:
      - "5001:5001"
    volumes:
      - panser_uploads:/app/src/static/uploads
      - paddle_models:/root/.paddlex
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5001/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  panser_uploads:
  paddle_models:
